; Konfigurasi PHP untuk deployment Docker
date.timezone = Asia/Jakarta

; Error: jangan tampilkan ke browser di production, tapi tetap dicatat
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Upload / request
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M

; Session
session.cookie_httponly = 1
session.use_strict_mode = 1

; Sembunyikan versi PHP di header
expose_php = Off
