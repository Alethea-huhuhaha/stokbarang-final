ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Blokir akses ke file sensitif jika suatu saat ikut ter-mount
<FilesMatch "(^\.|\.env|\.sql|\.ini|compose\.ya?ml)$">
    Require all denied
</FilesMatch>
